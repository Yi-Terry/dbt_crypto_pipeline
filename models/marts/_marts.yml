version: 2

models:
  - name: fct_crypto_daily_snapshot
    description: One row per coin per day (UTC), latest snapshot if loaded more than once that day.
    columns:
      - name: coin_id_snapshot_date
        tests:
          - unique
          - not_null
  - name: dim_coins
    description: One row per coin with slowly changing attributes
    columns:
      - name: coin_id
        tests:
          - unique
          - not_null
      - name: loaded_at
        tests:
          - not_null
  - name: market_movers
    description: Ranking coins by price_change_pct_24h
    columns:
      - name: coin_id
        tests:
          - unique
          - not_null
      - name: loaded_at 
        tests:
          - not_null
      - name: price_change_pct_24h
        tests:
          - not_null